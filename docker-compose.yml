# Local dev database. Usage:  docker compose up -d db
# Reset to a clean schema:    docker compose down -v && docker compose up -d db
services:
  db:
    image: postgres:16
    container_name: preduit-db
    environment:
      POSTGRES_DB: preduit
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: localadmin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in /docker-entrypoint-initdb.d run once, alphabetically, only
      # when the data volume is empty (first start).
      - ./db/V001_pg__consolidated_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/local/02-role-passwords.sql:/docker-entrypoint-initdb.d/02-role-passwords.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d preduit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
