# Flyway configuration for Preduit ERP (Azure SQL / SQL Server)
# Secrets are NOT stored here — pass URL/user/password via env vars or CI secrets:
#   flyway -url="$FLYWAY_URL" -user="$FLYWAY_USER" -password="$FLYWAY_PASSWORD" migrate
#
# Example URL (JDBC, ODBC Driver 18, encrypted):
#   jdbc:sqlserver://<server>.database.windows.net:1433;database=preduit;encrypt=true;trustServerCertificate=false;loginTimeout=30

flyway.locations=filesystem:.
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.cleanDisabled=true
flyway.encoding=UTF-8

# Run migrations under the privileged provisioning principal (exempt from RLS),
# NOT the runtime app user.
